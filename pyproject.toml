[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-budget"
version = "0.1.0"
description = "Call the Anthropic Claude API under a hard monthly budget with a shared SQLite ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pydantic>=2", "httpx2"]

[project.scripts]
claude-budget = "claude_budget.cli:main"

[tool.setuptools.packages.find]
include = ["claude_budget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
